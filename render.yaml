services:
  - type: web
    name: openfoodfacts-proxy
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_USER_AGENT
        value: VA/1.0 (contact@example.com)
      - key: ALLOWED_ORIGINS
        sync: false
