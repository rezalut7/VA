services:
  - type: web
    name: openfoodfacts-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APP_USER_AGENT
        value: FitnessPlatformPrototype/1.0 (contact@example.com)
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_TIMEOUT_MS
        value: "3600"
      - key: OPENAI_API_KEY
        sync: false
